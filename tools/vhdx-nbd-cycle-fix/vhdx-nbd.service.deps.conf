# Break the boot ordering cycle.
#
# mnt-MCServer.mount Requires this service, but a .mount unit gets default
# dependencies that include Before=local-fs.target. This service also got a
# default After=basic.target, and basic.target is ordered after sysinit.target,
# which is again before local-fs.target -- so service -> basic.target ->
# sysinit.target -> local-fs.target -> mount -> service closed the loop.
#
# Turning default dependencies off on BOTH units removes those target orders;
# the explicit Requires=/After= pair between them is what actually matters. The
# mount is still pulled in by multi-user.target via its [Install] section, and
# it still waits for the nbd device through blockdev@dev-nbd0p1.target.
#
# Deliberately no network ordering here: pulling in network-online.target or
# basic.target re-creates the cycle through sysinit.target.
[Unit]
DefaultDependencies=no
